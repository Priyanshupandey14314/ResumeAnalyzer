spring.application.name=resume-matcher
spring.datasource.url=jdbc:postgresql://localhost:5432/resumematcher
spring.datasource.username=postgres
spring.datasource.password=${db-pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jwt.expiration-ms=86400000

ai.api.url=https://api.groq.com/openai/v1/chat/completions
ai.api.model=openai/gpt-oss-20b
jwt.secret=${JWT_SECRET:local-dev-secret-key-must-be-at-least-32-characters-long}
ai.api.key=${GROQ_API_KEY:}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}